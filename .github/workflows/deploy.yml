# Build the site from main plus the latest data, and deploy it to GitHub Pages.
#
# The trading host pushes data only to the orphan `data` branch (site_publish.py):
# returns/<book>.json, ledger/<book>.json, allocations/<book>/<file>. This job replaces main's sample
# data with that branch, so bot commits never land on main. `npm run build` re-runs check-embargo,
# which refuses any allocation file younger than 14 days or not matching its ledger hash.
#
# The data branch is pushed with a deploy key, which cannot start workflows, so deploys run on a
# schedule after each of the host's two daily pushes, plus on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 12 * * 1-5" # after the ~07:10 ET morning push (sealed hashes, released files)
    - cron: "50 21 * * 1-5" # after the 16:25 ET push (the day's returns)
  workflow_dispatch:
    inputs:
      allow_sample:
        description: "Deploy main's sample data when the data branch has none (preview only)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Off switch: nothing builds or deploys until the repo variable DEPLOY_SITE is "true"
    # (Settings -> Secrets and variables -> Actions -> Variables). The data branch keeps filling either way.
    if: vars.DEPLOY_SITE == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.guard.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Replace the sample data with the data branch
        run: |
          if ! git ls-remote --exit-code --heads origin data >/dev/null; then
            echo "No data branch yet; keeping main's sample data."
            exit 0
          fi
          git fetch --depth 1 origin data
          mkdir _data
          git archive FETCH_HEAD | tar -x -C _data
          rm -rf src/data/returns src/data/ledger public/allocations
          mkdir -p src/data/returns src/data/ledger public/allocations
          cp -R _data/returns/. src/data/returns/ 2>/dev/null || true
          cp -R _data/ledger/. src/data/ledger/ 2>/dev/null || true
          cp -R _data/allocations/. public/allocations/ 2>/dev/null || true
          rm -rf _data
          echo "Data from $(git log -1 --format='%h %s' FETCH_HEAD):"
          ls -R src/data/returns src/data/ledger public/allocations | head -50

      - name: Refuse sample data unless asked
        id: guard
        env:
          ALLOW_SAMPLE: ${{ inputs.allow_sample || false }}
        run: |
          sample=$(grep -l '"sample": *true' src/data/returns/*.json src/data/ledger/*.json 2>/dev/null || true)
          if [ -n "$sample" ] && [ "$ALLOW_SAMPLE" != "true" ]; then
            echo "::notice::Not deploying: sample data in $(echo $sample | tr '\n' ' ')"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm

      - id: pages
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Build
        if: steps.guard.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
